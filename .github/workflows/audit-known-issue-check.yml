name: Audit Known-Issue Check

on:
  push:
    branches:
      - research/transient-coverage-validation

jobs:
  cyfrin-mediums:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download public Cyfrin Shares Cooldown report
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            'https://raw.githubusercontent.com/Cyfrin/cyfrin-audit-reports/main/reports/2026-01-23-cyfrin-strata-shares-cooldown-v2.0.pdf' \
            --output /tmp/strata-shares-cooldown.pdf
          test -s /tmp/strata-shares-cooldown.pdf
          file /tmp/strata-shares-cooldown.pdf

      - name: Extract pages relevant to Cyfrin M-6
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pypdf
          python3 - <<'PY'
          import re
          from pypdf import PdfReader

          reader = PdfReader('/tmp/strata-shares-cooldown.pdf')
          needles = (
              'increase in coverage',
              'previous withdrawal',
              'grief attack',
              'coverage',
              'finalize',
              'withdrawal request',
          )

          print('TOTAL PAGES', len(reader.pages))
          for page_no, page in enumerate(reader.pages, 1):
              raw = page.extract_text() or ''
              normalized = ' '.join(raw.lower().split())
              strong = (
                  'increase in coverage' in normalized
                  or 'previous withdrawal' in normalized
                  or 'grief attack' in normalized
              )
              contextual = ('coverage' in normalized and ('withdraw' in normalized or 'finaliz' in normalized))
              if not (strong or contextual):
                  continue
              print(f'=== PAGE {page_no} ===')
              # Preserve line order but normalize whitespace so the CI log remains readable.
              for line in raw.splitlines():
                  line = ' '.join(line.split())
                  if line:
                      print(line)
          PY
