name: Temporary Principal Loss v3 Forge

on:
  push:
    branches:
      - temp/forge-principal-loss-v3
    paths:
      - 'test/PoC/Guardian/IsolatedStrategyStaleNavPrincipalLossEscape.t.sol'
      - '.github/workflows/temp-principal-loss-v3-forge.yml'
  workflow_dispatch:

jobs:
  forge-poc:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: foundry-rs/foundry-toolchain@v1

      - name: Record execution provenance
        shell: bash
        run: |
          echo "HEAD=$(git rev-parse HEAD)"
          echo "BASELINE=$(git rev-parse HEAD~2)"
          forge --version
          sha256sum test/PoC/Guardian/IsolatedStrategyStaleNavPrincipalLossEscape.t.sol

      - name: Run exact principal-loss PoC with full trace
        shell: bash
        run: |
          set -o pipefail
          forge test \
            --match-path test/PoC/Guardian/IsolatedStrategyStaleNavPrincipalLossEscape.t.sol \
            -vvvv 2>&1 | tee forge-output.txt

      - name: Preserve Forge output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: principal-loss-v3-forge-output
          path: forge-output.txt
          if-no-files-found: warn
