name: Audit Known-Issue Check

on:
  push:
    branches:
      - research/transient-coverage-validation

jobs:
  cyfrin-mediums:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download public Cyfrin Shares Cooldown report
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            'https://raw.githubusercontent.com/Cyfrin/cyfrin-audit-reports/main/reports/2026-01-23-cyfrin-strata-shares-cooldown-v2.0.pdf' \
            --output /tmp/strata-shares-cooldown.pdf
          test -s /tmp/strata-shares-cooldown.pdf
          file /tmp/strata-shares-cooldown.pdf

      - name: Extract only M-2 and M-6 report headings
        shell: bash
        run: |
          set -euo pipefail
          pdftotext -layout /tmp/strata-shares-cooldown.pdf /tmp/report.txt
          python3 - <<'PY'
          from pathlib import Path
          import re

          lines = Path('/tmp/report.txt').read_text(errors='replace').splitlines()
          markers = ('M-2', 'M-6')
          found = {m: [] for m in markers}

          for i, line in enumerate(lines):
              normalized = ' '.join(line.split())
              for marker in markers:
                  if re.search(rf'\b{re.escape(marker)}\b', normalized):
                      # Print the matching line and up to two immediately following
                      # non-empty lines. This is enough to identify the title/status
                      # without dumping the report body.
                      block = [normalized]
                      j = i + 1
                      while j < len(lines) and len(block) < 3:
                          nxt = ' '.join(lines[j].split())
                          if nxt:
                              block.append(nxt)
                          j += 1
                      found[marker].append(' | '.join(block))

          for marker in markers:
              print(f'=== {marker} matches ===')
              if not found[marker]:
                  print('NO MATCH')
              else:
                  for match in found[marker][:8]:
                      print(match)
          PY
