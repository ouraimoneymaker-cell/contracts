name: Bughunt Strata Activity

on:
  push:
    branches:
      - bughunt/discrete-accounting-invariant

env:
  RPC_ETH: ${{ secrets.RPC_ETH || 'https://ethereum-rpc.publicnode.com' }}

jobs:
  strata-activity:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Measure recent APR-refresh quiet intervals
        shell: bash
        run: |
          export DEPOSIT_TOPIC="$(cast keccak 'Deposit(address,address,uint256,uint256)')"
          export WITHDRAW_TOPIC="$(cast keccak 'Withdraw(address,address,address,uint256,uint256)')"
          export APR_PUSH_TOPIC="$(cast keccak 'AprDataChangedViaPush(uint256,uint256)')"
          node <<'NODE'
          const candidates = [
            'https://eth.llamarpc.com',
            'https://ethereum.drpc.org',
            'https://1rpc.io/eth',
            process.env.RPC_ETH
          ].filter((v, i, a) => v && a.indexOf(v) === i);
          const JRT = '0xC58D044404d8B14e953C115E67823784dEA53d8F';
          const SRT = '0x3d7d6fdf07EE548B939A80edbc9B2256d0cdc003';
          const ACCOUNTING = '0xa436c5Dd1Ba62c55D112C10cd10E988bb3355102';
          const DEPOSIT = process.env.DEPOSIT_TOPIC.toLowerCase();
          const WITHDRAW = process.env.WITHDRAW_TOPIC.toLowerCase();
          const APR_PUSH = process.env.APR_PUSH_TOPIC.toLowerCase();
          let id = 1;
          const archiveRejected = new Set();

          async function callEndpoint(url, method, params) {
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 15000);
            try {
              const r = await fetch(url, {
                method: 'POST',
                headers: {'content-type':'application/json'},
                body: JSON.stringify({jsonrpc:'2.0', id:id++, method, params}),
                signal: controller.signal
              });
              const text = await r.text();
              if (!r.ok) throw new Error(`HTTP ${r.status}: ${text.slice(0,180)}`);
              const j = JSON.parse(text);
              if (j.error) throw new Error(JSON.stringify(j.error));
              return j.result;
            } finally {
              clearTimeout(timeout);
            }
          }

          async function rpc(method, params) {
            let last;
            for (const url of candidates) {
              if (method === 'eth_getLogs' && archiveRejected.has(url)) continue;
              try {
                return await callEndpoint(url, method, params);
              } catch (e) {
                last = e;
                const msg = String(e && e.message || e);
                if (method === 'eth_getLogs' && /archive|historical|range|token/i.test(msg)) {
                  archiveRejected.add(url);
                }
              }
            }
            throw new Error(`${method} failed on all RPCs: ${last}`);
          }

          const hex = n => '0x' + n.toString(16);
          const latest = parseInt(await rpc('eth_blockNumber', []), 16);
          const lookback = 100000; // roughly two weeks on Ethereum
          const start = Math.max(0, latest - lookback);
          const chunk = 2000;
          const events = [];

          async function collect(address, topics, source) {
            for (let from = start; from <= latest; from += chunk) {
              const to = Math.min(latest, from + chunk - 1);
              const logs = await rpc('eth_getLogs', [{
                fromBlock: hex(from),
                toBlock: hex(to),
                address,
                topics: [topics]
              }]);
              for (const log of logs) {
                const t = log.topics[0].toLowerCase();
                let kind = source;
                if (t === DEPOSIT) kind = `${source}:Deposit`;
                else if (t === WITHDRAW) kind = `${source}:Withdraw`;
                else if (t === APR_PUSH) kind = 'Accounting:AprPush';
                events.push({block: parseInt(log.blockNumber,16), tx:log.transactionHash, kind});
              }
            }
          }

          await collect(JRT, [DEPOSIT, WITHDRAW], 'JRT');
          await collect(SRT, [DEPOSIT, WITHDRAW], 'SRT');
          await collect(ACCOUNTING, APR_PUSH, 'Accounting');

          // Multiple relevant logs can occur in one transaction/block; for poison lifetime the
          // block timestamp is what matters, so dedupe refresh moments by block.
          events.sort((a,b)=>a.block-b.block);
          const refreshByBlock = [];
          for (const e of events) {
            const last = refreshByBlock[refreshByBlock.length - 1];
            if (last && last.block === e.block) last.kinds.add(e.kind);
            else refreshByBlock.push({block:e.block, kinds:new Set([e.kind]), tx:e.tx});
          }

          const uniqueBlocks = [...new Set([start, latest, ...refreshByBlock.map(e=>e.block)])].sort((a,b)=>a-b);
          const timestamps = new Map();
          for (let i=0; i<uniqueBlocks.length; i+=6) {
            const batch = uniqueBlocks.slice(i,i+6);
            const blocks = await Promise.all(batch.map(b => rpc('eth_getBlockByNumber',[hex(b),false])));
            blocks.forEach((blk,j)=>timestamps.set(batch[j], parseInt(blk.timestamp,16)));
          }
          const startTs = timestamps.get(start);
          const latestTs = timestamps.get(latest);
          for (const e of refreshByBlock) e.ts = timestamps.get(e.block);

          const gaps = [];
          let prevTs = startTs;
          let prevLabel = 'window-start';
          for (const e of refreshByBlock) {
            const label = [...e.kinds].sort().join('+');
            gaps.push({seconds:e.ts-prevTs, from:prevLabel, to:label, endBlock:e.block});
            prevTs = e.ts;
            prevLabel = label;
          }
          gaps.push({seconds:latestTs-prevTs, from:prevLabel, to:'now', endBlock:latest});
          gaps.sort((a,b)=>b.seconds-a.seconds);

          const sortedGapSeconds = gaps.map(g=>g.seconds).sort((a,b)=>a-b);
          const percentile = p => sortedGapSeconds.length ? sortedGapSeconds[Math.min(sortedGapSeconds.length-1, Math.floor((sortedGapSeconds.length-1)*p))] : 0;
          const fmt = s => `${s}s = ${(s/3600).toFixed(2)}h = ${(s/86400).toFixed(2)}d`;

          console.log('RPC candidates', candidates.join(', '));
          console.log('RPCs rejected for archive log queries', [...archiveRejected].join(', ') || 'none');
          console.log('latest block', latest);
          console.log('lookback start block', start);
          console.log('window duration', fmt(latestTs-startTs));
          console.log('raw refresh-relevant log count', events.length);
          console.log('distinct refresh-relevant blocks', refreshByBlock.length);
          console.log('JRT deposits', events.filter(e=>e.kind==='JRT:Deposit').length);
          console.log('JRT withdrawals', events.filter(e=>e.kind==='JRT:Withdraw').length);
          console.log('SRT deposits', events.filter(e=>e.kind==='SRT:Deposit').length);
          console.log('SRT withdrawals', events.filter(e=>e.kind==='SRT:Withdraw').length);
          console.log('Accounting APR pushes', events.filter(e=>e.kind==='Accounting:AprPush').length);
          console.log('median observed refresh gap', fmt(percentile(0.50)));
          console.log('p90 observed refresh gap', fmt(percentile(0.90)));
          console.log('p95 observed refresh gap', fmt(percentile(0.95)));
          if (refreshByBlock.length) {
            const last = refreshByBlock[refreshByBlock.length-1];
            console.log('most recent refresh-relevant block', last.block, [...last.kinds].join('+'), 'age', fmt(latestTs-last.ts));
          } else {
            console.log('no refresh-relevant events in window');
          }
          console.log('largest observed event-free gaps:');
          for (const g of gaps.slice(0,10)) console.log(fmt(g.seconds), g.from, '->', g.to, 'ending block', g.endBlock);

          console.log('most recent refresh-relevant events:');
          for (const e of refreshByBlock.slice(-15)) {
            console.log(new Date(e.ts*1000).toISOString(), 'block', e.block, [...e.kinds].sort().join('+'), e.tx);
          }
          NODE
