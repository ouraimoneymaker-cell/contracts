name: nOPAL DYS Stale Loss PoC

on:
  push:
    branches:
      - security/nopal-dys-stale-loss-poc
    paths:
      - 'test/PoC/NestOpalDYSStaleLossPoC.t.sol'
      - 'test/PoC/NestOpalDYSStaleLossEconomics.t.sol'
      - 'test/PoC/NestOpalDYSStaleLossSeniorSpill.t.sol'
      - '.github/workflows/nopal-dys-stale-loss-poc.yml'
  workflow_dispatch:

jobs:
  nopal-poc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      - uses: foundry-rs/foundry-toolchain@v1

      - name: Trace primary nOPAL stale-loss exploit
        run: forge test --match-path test/PoC/NestOpalDYSStaleLossPoC.t.sol --match-test test_NegativeRateDelayLetsFirstJrtRedeemerExternalizeLoss -vvvv

      - name: Run complete nOPAL stale-loss PoC suite
        run: forge test --match-path test/PoC/NestOpalDYSStaleLossPoC.t.sol -vv

      - name: Run current-like nOPAL Senior spill regression
        run: forge test --match-path test/PoC/NestOpalDYSStaleLossSeniorSpill.t.sol --match-test test_CurrentLikeCoverageWhaleExitCanPushDeferredLossIntoSenior -vvv

      - name: Run current-like nOPAL economics boundary regression
        run: forge test --match-path test/PoC/NestOpalDYSStaleLossEconomics.t.sol -vvv

      - name: Run Strata existing non-fork nOPAL regression suite
        run: forge test --match-path test/nest/NestOpalTest.t.sol -vv
