name: Audit Transient Coverage PoC

on:
  push:
    branches:
      - audit/transient-coverage-bypass-poc

jobs:
  poc:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - run: npm ci
      - run: npm run compile

      - name: Run classification PoC
        id: classification
        continue-on-error: true
        run: npx atma test test/tranches/PoC/TransientCoverageBypass.spec.ts

      - name: Run economic impact PoC
        id: impact
        continue-on-error: true
        run: npx atma test test/tranches/PoC/TransientCoverageBypassImpact.spec.ts

      - name: Require both PoCs to pass
        if: always()
        run: |
          echo "classification=${{ steps.classification.outcome }}"
          echo "impact=${{ steps.impact.outcome }}"
          test "${{ steps.classification.outcome }}" = "success"
          test "${{ steps.impact.outcome }}" = "success"
