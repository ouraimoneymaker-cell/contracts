name: Bughunt Foundry

on:
  push:
    branches:
      - bughunt/discrete-accounting-invariant

jobs:
  discrete-accounting-invariant:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - uses: foundry-rs/foundry-toolchain@v1

      # These two pre-existing Guardian PoCs do not compile under the current Foundry
      # toolchain because of generated DeployHelper98 constructor arguments. They are
      # unrelated to this hunt and are moved only inside the disposable CI checkout.
      - name: Isolate unrelated legacy Guardian PoCs
        run: |
          mkdir -p /tmp/strata-legacy-pocs
          mv test/PoC/Guardian/StrataProtocolDeploymentBase.sol /tmp/strata-legacy-pocs/
          mv test/PoC/Guardian/WithdrawGriefingDoS.sol /tmp/strata-legacy-pocs/

      - name: Run DiscreteAccounting invariant harness
        run: forge test --match-path test/PoC/Guardian/DiscreteAccountingConservationInvariant.t.sol -vvv
