name: Bughunt Foundry

on:
  push:
    branches:
      - bughunt/discrete-accounting-invariant

env:
  RPC_ETH: ${{ secrets.RPC_ETH }}

jobs:
  discrete-accounting-invariant:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - uses: foundry-rs/foundry-toolchain@v1

      # Forge discovers the repository's whole test tree during compilation even with
      # --match-path. Keep this disposable CI checkout focused on the active hunt files.
      - name: Isolate the hunt test tree
        run: |
          mkdir -p /tmp/strata-test-tree
          mv test /tmp/strata-test-tree/original
          mkdir -p test/PoC/Guardian
          cp /tmp/strata-test-tree/original/PoC/Guardian/DiscreteAccountingConservationInvariant.t.sol \
            test/PoC/Guardian/DiscreteAccountingConservationInvariant.t.sol
          cp /tmp/strata-test-tree/original/PoC/Guardian/AaveAprFallbackManipulation.t.sol \
            test/PoC/Guardian/AaveAprFallbackManipulation.t.sol
          cp /tmp/strata-test-tree/original/PoC/Guardian/AaveAprProviderForkSensitivity.t.sol \
            test/PoC/Guardian/AaveAprProviderForkSensitivity.t.sol

      - name: Run DiscreteAccounting invariant harness
        run: forge test --match-path test/PoC/Guardian/DiscreteAccountingConservationInvariant.t.sol -vvv

      - name: Run Aave APR fallback manipulation probe
        run: forge test --match-path test/PoC/Guardian/AaveAprFallbackManipulation.t.sol -vvv

      - name: Run deployed Aave APR provider fork sensitivity probe
        run: forge test --match-path test/PoC/Guardian/AaveAprProviderForkSensitivity.t.sol -vvv
