name: Test

on:
  push:

env:
  RPC_ETH: ${{ secrets.RPC_ETH }}

jobs:
  compile-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive
      - uses: actions/setup-node@v3
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - run: npm ci
      - run: npm run compile
      - run: npm run test
