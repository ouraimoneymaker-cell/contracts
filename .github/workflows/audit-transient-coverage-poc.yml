name: Audit Transient Coverage PoC

on:
  push:
    branches:
      - audit/transient-coverage-bypass-poc

jobs:
  poc:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - run: npm ci
      - run: npm run compile
      - name: Run Saturn-native classification PoC
        run: npx atma test test/tranches/PoC/TransientCoverageBypass.spec.ts
      - name: Run mHYPER economic impact PoC
        run: npx atma test test/tranches/PoC/TransientCoverageBypassImpact.spec.ts
      - name: Run Saturn-native economic impact PoC
        run: npx atma test test/tranches/PoC/TransientCoverageBypassSaturnImpact.spec.ts
