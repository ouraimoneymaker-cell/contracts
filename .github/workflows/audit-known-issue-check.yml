name: Audit Known-Issue Check

on:
  push:
    branches:
      - research/transient-coverage-validation

jobs:
  cyfrin-mediums:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download public Cyfrin Shares Cooldown report
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            'https://raw.githubusercontent.com/Cyfrin/cyfrin-audit-reports/main/reports/2026-01-23-cyfrin-strata-shares-cooldown-v2.0.pdf' \
            --output /tmp/strata-shares-cooldown.pdf
          test -s /tmp/strata-shares-cooldown.pdf
          file /tmp/strata-shares-cooldown.pdf

      - name: Extract Cyfrin M-2 and full M-6 context
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pypdf
          python3 - <<'PY'
          import re
          from pypdf import PdfReader

          reader = PdfReader('/tmp/strata-shares-cooldown.pdf')
          text = '\n'.join((page.extract_text() or '') for page in reader.pages)
          lines = [' '.join(line.split()) for line in text.splitlines()]

          # Identify M-2 and M-6 occurrences, including TOC and body occurrences.
          for marker in ('M-2', 'M-6'):
              print(f'=== {marker} OCCURRENCES ===')
              indices = [i for i, line in enumerate(lines) if f'[{marker}]' in line or re.search(rf'\b{marker}\b', line)]
              for n, idx in enumerate(indices, 1):
                  print(f'--- occurrence {n} at line {idx} ---')
                  # For the actual finding body, print from the marker until the next
                  # finding heading. For a TOC occurrence this will stay compact.
                  block = []
                  for j in range(idx, min(len(lines), idx + 220)):
                      line = lines[j]
                      if j > idx and re.match(r'^\[(?:H|M|L|I)-\d+\]', line):
                          break
                      if line:
                          block.append(line)
                      if sum(len(x) + 1 for x in block) > 12000:
                          break
                  print('\n'.join(block))
          PY
